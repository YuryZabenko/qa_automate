name: Smoke Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/**/*.spec.js'
      - 'playwright.config.ts'
  push:
    branches: [main]
    paths:
      - 'tests/smoke/**'
      - 'playwright.config.ts'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  CI: true
  BASE_URL: ${{ secrets.BASE_URL }}

jobs:
  smoke-tests:
    name: Run Smoke Tests (@smoke) - ${{ matrix.browser }}
    timeout-minutes: 20
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run smoke tests
        run: npx playwright test --grep @smoke --project=${{ matrix.browser }}
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
            allure-results/
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ matrix.browser }}
          path: test-results/**/*.png
          retention-days: 14

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-videos-${{ matrix.browser }}
          path: test-results/**/*.webm
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-traces-${{ matrix.browser }}
          path: test-results/**/trace.zip
          retention-days: 14

  # объединение отчетов
  merge-reports:
    name: Merge Smoke Reports
    if: always()
    needs: [smoke-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Скачиваем все артефакты
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: smoke-test-results-*
          merge-multiple: true

      # Извлекаем файлы отчетов из папок
      - name: Extract report files
        run: |
          echo "Original structure:"
          ls -la all-reports/

          mkdir -p reports-files

          echo "Searching for report files..."
          find all-reports -type f -name "*.json" -exec cp {} reports-files/ \; 2>/dev/null || echo "No JSON files found"

          if [ -d "all-reports/playwright-report" ]; then
            echo "Found playwright-report folder"
            cp -r all-reports/playwright-report/* reports-files/ 2>/dev/null || true
          fi

          echo "Extracted files:"
          ls -la reports-files/

      # Объединяем отчеты
      - name: Merge reports
        run: |
          if [ -n "$(find reports-files -type f -name '*.json' | head -1)" ]; then
            echo "Found JSON reports, merging..."
            npx playwright merge-reports --reporter=html ./reports-files
          else
            echo "⚠️ No JSON reports found, creating summary report from HTML files"
            mkdir -p playwright-report
            echo "<html><head><title>Smoke Test Results</title></head><body>" > playwright-report/index.html
            echo "<h1>Smoke Test Results</h1>" >> playwright-report/index.html
            echo "<ul>" >> playwright-report/index.html

            for browser in chromium firefox webkit; do
              if [ -d "all-reports/playwright-report" ]; then
                echo "<li><a href='$browser/index.html'>$browser report</a></li>" >> playwright-report/index.html
              fi
            done

            echo "</ul>" >> playwright-report/index.html
            echo "</body></html>" >> playwright-report/index.html
          fi

      # Сохраняем объединенный отчет
      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-merged-report
          path: playwright-report/
          retention-days: 30
