name: Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/**/*.spec.js'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.prettierrc.js'
  push:
    branches: [main]
    paths:
      - 'tests/**/*.spec.js'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.prettierrc.js'
jobs:
  quality-gate:
    name: Quality Gate - Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Quality Gate Passed
        if: success()
        run: echo "All quality checks passed!"

      - name: Quality Gate Failed
        if: failure()
        run: |
          echo "Quality gate failed!"
          echo "Please fix linting and formatting issues."
          exit 1
