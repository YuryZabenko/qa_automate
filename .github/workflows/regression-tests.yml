name: Full Regression Tests

on:
  push:
    branches: [main]
    paths:
      - 'tests/**/*.spec.js'
      - 'playwright.config.ts'
  schedule:
    - cron: '0 3 * * *' # Daily at 3:00 AM
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      browsers:
        description: 'Browsers to test'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

env:
  CI: true

jobs:
  regression-tests:
    name: Run Regression - ${{ matrix.browser }} (shard ${{ matrix.shard }})
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - ${{ github.event.inputs.browsers == 'all' && 'chromium' || github.event.inputs.browsers || 'chromium' }}
          - ${{ github.event.inputs.browsers == 'all' && 'firefox' || '' }}
          - ${{ github.event.inputs.browsers == 'all' && 'webkit' || '' }}
        shard: [1/3, 2/3, 3/3]
        exclude:
          - browser: ''
          - browser: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run regression tests
        run: |
          if [ "${{ matrix.browser }}" != "" ]; then
            npx playwright test --grep @regression --project=${{ matrix.browser }} --shard=${{ matrix.shard }}
          else
            npx playwright test --grep @regression --shard=${{ matrix.shard }}
          fi
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-screenshots-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/**/*.png
          retention-days: 14

      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-videos-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/**/*.webm
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-traces-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/**/trace.zip
          retention-days: 14